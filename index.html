<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mr V Player</title>

<script type="module"
src="https://cdn.jsdelivr.net/npm/movi-player/dist/element.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080808;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
}

header{
height:64px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #222;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00e5ff;
}

main{
width:min(1100px,94%);
margin:25px auto;
}

.card{
background:#111;
border:1px solid #252525;
border-radius:16px;
padding:18px;
margin-bottom:18px;
}

h2{
margin-top:0;
font-size:20px;
}

.input-row{
display:flex;
gap:10px;
}

input[type=text]{
flex:1;
background:#080808;
border:1px solid #333;
border-radius:10px;
padding:14px;
color:white;
font-size:14px;
direction:ltr;
}

button{
border:0;
border-radius:10px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
background:#00e5ff;
color:#001014;
}

button:hover{
opacity:.85;
}

button.secondary{
background:#222;
color:#fff;
}

.player-wrap{
background:#000;
border-radius:14px;
overflow:hidden;
min-height:300px;
}

movi-player{
display:block;
width:100%;
height:min(65vw,620px);
background:#000;
}

.tracks{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.track-box{
background:#0c0c0c;
border:1px solid #252525;
border-radius:12px;
padding:12px;
}

.track-box label{
display:block;
margin-bottom:7px;
font-size:13px;
color:#aaa;
}

select{
width:100%;
background:#111;
color:#fff;
border:1px solid #333;
border-radius:8px;
padding:10px;
}

.status{
margin-top:12px;
padding:12px;
border-radius:10px;
background:#0d0d0d;
border:1px solid #222;
font-size:13px;
direction:rtl;
}

.ok{color:#55ff99}
.err{color:#ff5c5c}
.info{color:#00e5ff}
.warn{color:#ffd166}

.file-row{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

input[type=file]{
color:#aaa;
max-width:100%;
}

.history{
max-height:220px;
overflow:auto;
}

.history-item{
padding:10px;
border-bottom:1px solid #222;
cursor:pointer;
direction:ltr;
font-size:13px;
}

.history-item:hover{
background:#191919;
}

@media(max-width:700px){
.input-row{
flex-direction:column;
}

.tracks{
grid-template-columns:1fr;
}

movi-player{
height:55vw;
min-height:230px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">Mr V Player</div>
<div>MKV Player</div>
</header>

<main>

<div class="card">

<h2>🎬 پخش آنلاین</h2>

<div class="input-row">

<input
id="urlInput"
type="text"
placeholder="لینک مستقیم MKV را وارد کنید..."
autocomplete="off"
>

<button id="playBtn">
PLAY
</button>

</div>

<div class="status" id="status">
آماده پخش
</div>

</div>


<div class="card">

<h2>📁 پخش فایل MKV از دستگاه</h2>

<div class="file-row">

<input
id="fileInput"
type="file"
accept=".mkv,.mp4,.webm,.mov,.m4v,.ts"
>

<button
class="secondary"
id="clearBtn">
پاک کردن
</button>

</div>

</div>


<div class="card">

<div class="player-wrap">

<movi-player
id="mkvPlayer"
controls
playsinline
sw="auto"
preload="metadata"
crossorigin="anonymous">
</movi-player>

</div>


<div class="tracks">

<div class="track-box">

<label>🎧 Audio</label>

<select id="audioSelect">
<option value="">در انتظار اطلاعات...</option>
</select>

</div>


<div class="track-box">

<label>💬 Subtitle</label>

<select id="subtitleSelect">
<option value="">خاموش</option>
</select>

</div>

</div>

</div>


<div class="card">

<h2>📋 وضعیت</h2>

<div id="details" class="status">
هیچ فایلی بارگذاری نشده است.
</div>

</div>


<div class="card">

<h2>🕘 History</h2>

<div id="history" class="history"></div>

</div>

</main>


<script>
"use strict";

const player = document.getElementById("mkvPlayer");
const urlInput = document.getElementById("urlInput");
const playBtn = document.getElementById("playBtn");
const fileInput = document.getElementById("fileInput");
const clearBtn = document.getElementById("clearBtn");

const audioSelect = document.getElementById("audioSelect");
const subtitleSelect = document.getElementById("subtitleSelect");

const statusBox = document.getElementById("status");
const details = document.getElementById("details");
const historyBox = document.getElementById("history");

let currentSource = "";
let currentFile = null;


/* =========================================================
   STATUS
========================================================= */

function status(text, type="info"){
    statusBox.className = "status " + type;
    statusBox.textContent = text;
}

function detail(text, type="info"){
    details.className = "status " + type;
    details.textContent = text;
}


/* =========================================================
   URL
========================================================= */

function cleanDisplayUrl(url){

    try{
        const u = new URL(url);

        return u.origin +
               u.pathname +
               (u.search || "");

    }catch{
        return url;
    }
}


/*
 * بسیار مهم:
 * این تابع URL را تغییر نمی‌دهد.
 * یعنی:
 *
 * ?expire=...
 * &hash=...
 * token
 * query
 * signed URL
 *
 * همگی حفظ می‌شوند.
 */

function preserveExactUrl(value){

    return String(value || "").trim();
}


/* =========================================================
   HISTORY
========================================================= */

function getHistory(){

    try{
        return JSON.parse(
            localStorage.getItem("mrVHistory") || "[]"
        );
    }catch{
        return [];
    }
}

function saveHistory(url){

    if(!url) return;

    let list = getHistory();

    list = list.filter(x => x !== url);

    list.unshift(url);

    list = list.slice(0,20);

    localStorage.setItem(
        "mrVHistory",
        JSON.stringify(list)
    );

    renderHistory();
}

function renderHistory(){

    const list = getHistory();

    if(!list.length){

        historyBox.innerHTML =
            '<div style="color:#777;padding:10px">History خالی است.</div>';

        return;
    }

    historyBox.innerHTML = "";

    list.forEach(url => {

        const item = document.createElement("div");

        item.className = "history-item";

        item.textContent = url;

        item.onclick = () => {

            urlInput.value = url;

            playRemote(url);
        };

        historyBox.appendChild(item);

    });
}


/* =========================================================
   TRACKS
========================================================= */

function resetTracks(){

    audioSelect.innerHTML =
        '<option value="">در انتظار اطلاعات...</option>';

    subtitleSelect.innerHTML =
        '<option value="">خاموش</option>';
}


function getLabel(track, index, type){

    if(typeof track === "string"){
        return track || `${type} ${index + 1}`;
    }

    const label =
        track?.label ||
        track?.title ||
        track?.name ||
        track?.language ||
        track?.lang ||
        `${type} ${index + 1}`;

    return label;
}


async function loadTracks(){

    resetTracks();

    await new Promise(resolve => setTimeout(resolve,500));

    try{

        /* ---------------- AUDIO ---------------- */

        let audios = [];

        if(typeof player.getAudioLangs === "function"){

            const result =
                await Promise.resolve(
                    player.getAudioLangs()
                );

            if(Array.isArray(result)){
                audios = result;
            }

        }

        /*
         * اگر API زبان نتیجه نداد،
         * API خام Trackها را امتحان می‌کنیم.
         */

        if(
            !audios.length &&
            player.player &&
            typeof player.player.getAudioTracks === "function"
        ){

            const result =
                await Promise.resolve(
                    player.player.getAudioTracks()
                );

            if(Array.isArray(result)){
                audios = result;
            }

        }


        audioSelect.innerHTML = "";

        if(audios.length){

            audios.forEach((track,index) => {

                const lang =
                    typeof track === "string"
                    ? track
                    : (
                        track.lang ||
                        track.language ||
                        track.id ||
                        ""
                    );

                const label =
                    getLabel(track,index,"Audio");

                const option =
                    document.createElement("option");

                option.value = String(lang);

                option.textContent =
                    label +
                    (
                        typeof track === "object" &&
                        track.language &&
                        track.label &&
                        track.language !== track.label
                        ? ` (${track.language})`
                        : ""
                    );

                if(
                    typeof track === "object" &&
                    track.active
                ){
                    option.selected = true;
                }

                audioSelect.appendChild(option);

            });

        }else{

            audioSelect.innerHTML =
                '<option value="">Audio پیدا نشد</option>';

        }


        /* ---------------- SUBTITLE ---------------- */

        let subtitles = [];

        if(typeof player.getSubtitleLangs === "function"){

            const result =
                await Promise.resolve(
                    player.getSubtitleLangs()
                );

            if(Array.isArray(result)){
                subtitles = result;
            }

        }

        if(
            !subtitles.length &&
            player.player &&
            typeof player.player.getSubtitleTracks === "function"
        ){

            const result =
                await Promise.resolve(
                    player.player.getSubtitleTracks()
                );

            if(Array.isArray(result)){
                subtitles = result;
            }

        }


        subtitleSelect.innerHTML =
            '<option value="">خاموش</option>';


        subtitles.forEach((track,index) => {

            const lang =
                typeof track === "string"
                ? track
                : (
                    track.lang ||
                    track.language ||
                    track.id ||
                    ""
                );

            const label =
                getLabel(track,index,"Subtitle");

            const option =
                document.createElement("option");

            option.value = String(lang);

            option.textContent =
                label +
                (
                    typeof track === "object" &&
                    track.forced
                    ? " — Forced"
                    : ""
                );

            if(
                typeof track === "object" &&
                track.active
            ){
                option.selected = true;
            }

            subtitleSelect.appendChild(option);

        });


        detail(
            `Audio: ${audios.length} | Subtitle: ${subtitles.length}`,
            "ok"
        );

    }catch(error){

        console.error("Track error:",error);

        detail(
            "خطا در خواندن Trackهای MKV: " +
            (error?.message || error),
            "warn"
        );

    }
}


/* =========================================================
   AUDIO
========================================================= */

audioSelect.addEventListener("change", async () => {

    const lang = audioSelect.value;

    if(!lang) return;

    try{

        if(typeof player.selectAudioLang === "function"){

            const result =
                await Promise.resolve(
                    player.selectAudioLang(lang)
                );

            detail(
                "Audio انتخاب شد: " + lang,
                "ok"
            );

            return result;
        }

        if(
            player.player &&
            typeof player.player.selectAudioLang === "function"
        ){

            return player.player.selectAudioLang(lang);
        }

    }catch(error){

        detail(
            "انتخاب Audio ناموفق بود: " +
            (error?.message || error),
            "err"
        );

    }

});


/* =========================================================
   SUBTITLE
========================================================= */

subtitleSelect.addEventListener("change", async () => {

    const lang = subtitleSelect.value;

    try{

        if(typeof player.selectSubtitleLang === "function"){

            await player.selectSubtitleLang(
                lang || null
            );

            detail(
                lang
                ? "Subtitle انتخاب شد: " + lang
                : "Subtitle خاموش شد",
                "ok"
            );

            return;
        }

        if(
            player.player &&
            typeof player.player.selectSubtitleLang === "function"
        ){

            await player.player.selectSubtitleLang(
                lang || null
            );

        }

    }catch(error){

        detail(
            "انتخاب Subtitle ناموفق بود: " +
            (error?.message || error),
            "err"
        );

    }

});


/* =========================================================
   MKV REMOTE
========================================================= */

async function playRemote(rawUrl){

    const source =
        preserveExactUrl(rawUrl);

    if(!source){

        status(
            "لینک وارد نشده است.",
            "err"
        );

        return;
    }


    /*
     * تشخیص HTTP روی HTTPS
     */

    if(
        location.protocol === "https:" &&
        source.toLowerCase().startsWith("http://")
    ){

        status(
            "این لینک HTTP است و صفحه HTTPS است؛ مرورگر ممکن است آن را به‌دلیل Mixed Content مسدود کند.",
            "warn"
        );

        detail(
            "برای لینک HTTP باید سرور/لینک HTTPS باشد. کد نمی‌تواند محدودیت Mixed Content مرورگر را دور بزند.",
            "warn"
        );

        /*
         * با این حال تلاش می‌کنیم URL را به Movi بدهیم.
         * اگر مرورگر اجازه بدهد، پخش انجام می‌شود.
         */

    }else{

        status(
            "در حال بارگذاری MKV...",
            "info"
        );

    }


    currentSource = source;

    resetTracks();


    try{

        /*
         * مهم:
         *
         * src دقیقاً همان URL است.
         *
         * Query حذف نمی‌شود.
         */

        player.removeAttribute("src");

        await new Promise(resolve =>
            setTimeout(resolve,50)
        );

        player.src = source;

        /*
         * fallback برای Custom Element
         */

        player.setAttribute(
            "src",
            source
        );


        saveHistory(source);

        detail(
            "Source:\n" +
            cleanDisplayUrl(source),
            "info"
        );


        /*
         * کمی زمان برای Demuxer
         */

        setTimeout(
            loadTracks,
            1200
        );


    }catch(error){

        console.error(error);

        status(
            "خطا در بارگذاری MKV",
            "err"
        );

        detail(
            error?.message || String(error),
            "err"
        );

    }

}


/* =========================================================
   LOCAL FILE
========================================================= */

fileInput.addEventListener("change", async () => {

    const file =
        fileInput.files?.[0];

    if(!file) return;

    currentFile = file;

    resetTracks();

    try{

        /*
         * روش رسمی Movi برای File
         */

        if(typeof player.setFile === "function"){

            player.setFile(file);

        }else{

            player.src = file;

        }


        status(
            "فایل محلی در حال بارگذاری است...",
            "info"
        );

        detail(
            `${file.name}\n${Math.round(file.size / 1024 / 1024 * 100) / 100} MB`,
            "ok"
        );


        setTimeout(
            loadTracks,
            1000
        );

    }catch(error){

        console.error(error);

        status(
            "خطا در باز کردن فایل",
            "err"
        );

        detail(
            error?.message || String(error),
            "err"
        );

    }

});


/* =========================================================
   BUTTON
========================================================= */

playBtn.addEventListener("click", () => {

    const url =
        preserveExactUrl(
            urlInput.value
        );

    playRemote(url);

});


urlInput.addEventListener("keydown", e => {

    if(e.key === "Enter"){

        playBtn.click();

    }

});


clearBtn.addEventListener("click", () => {

    fileInput.value = "";

    currentFile = null;

    player.removeAttribute("src");

    resetTracks();

    status(
        "پلیر پاک شد.",
        "info"
    );

    detail(
        "هیچ فایل یا لینک فعالی وجود ندارد.",
        "info"
    );

});


/* =========================================================
   PLAYER EVENTS
========================================================= */

player.addEventListener(
    "loadedmetadata",
    () => {

        status(
            "Metadata دریافت شد.",
            "ok"
        );

        setTimeout(
            loadTracks,
            300
        );

    }
);


player.addEventListener(
    "loadeddata",
    () => {

        status(
            "MKV آماده پخش است.",
            "ok"
        );

        loadTracks();

    }
);


player.addEventListener(
    "canplay",
    () => {

        status(
            "آماده پخش ▶",
            "ok"
        );

    }
);


player.addEventListener(
    "play",
    () => {

        status(
            "در حال پخش ▶",
            "ok"
        );

    }
);


player.addEventListener(
    "pause",
    () => {

        status(
            "متوقف شده",
            "info"
        );

    }
);


player.addEventListener(
    "error",
    event => {

        console.error(
            "Movi error:",
            event
        );

        status(
            "خطای پخش MKV",
            "err"
        );

        detail(
            "احتمالاً یکی از این موارد مشکل دارد:\n" +
            "1. CORS سرور\n" +
            "2. Mixed Content (HTTP روی صفحه HTTPS)\n" +
            "3. لینک منقضی شده\n" +
            "4. سرور فایل را قبول نمی‌کند\n" +
            "5. Codec پشتیبانی‌نشده",
            "err"
        );

    }
);


/* =========================================================
   TRACK EVENTS
========================================================= */

player.addEventListener(
    "audiotrackchange",
    () => {

        setTimeout(
            loadTracks,
            100
        );

    }
);


player.addEventListener(
    "subtitleTrackChange",
    () => {

        setTimeout(
            loadTracks,
            100
        );

    }
);


/* =========================================================
   INIT
========================================================= */

renderHistory();
resetTracks();

detail(
    "Mr V Player آماده است.",
    "info"
);

</script>

</body>
</html>
