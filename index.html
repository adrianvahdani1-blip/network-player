<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr V Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --card: #111111;
      --card2: #171717;
      --red: #e50914;
      --red2: #ff1e2d;
      --text: #ffffff;
      --muted: #999999;
      --border: #292929;
      --disabled: #303030;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Segoe UI", Tahoma, sans-serif;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      padding: 17px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      background: rgba(8, 8, 8, .96);
      border-bottom: 1px solid var(--border);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;

      border-radius: 12px;
      background: var(--red);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      font-weight: bold;

      box-shadow: 0 0 25px rgba(229, 9, 20, .25);
    }

    .brand-text h1 {
      font-size: 21px;
    }

    .brand-text span {
      color: var(--muted);
      font-size: 12px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav {
      display: flex;
      gap: 5px;
    }

    nav button,
    .language-btn {
      background: transparent;
      border: 1px solid transparent;

      color: #ccc;

      padding: 9px 13px;

      border-radius: 9px;

      cursor: pointer;

      transition: .2s;
    }

    nav button:hover,
    .language-btn:hover {
      color: white;
      background: #191919;
    }

    .language-btn {
      border-color: var(--border);
      color: white;
      font-weight: bold;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1050px, 92%);
      margin: auto;

      padding: 45px 0 65px;
    }

    section {
      scroll-margin-top: 100px;
    }

    .hero {
      text-align: center;
      padding: 35px 0 30px;
    }

    .hero h2 {
      font-size: clamp(30px, 5vw, 52px);
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--muted);
      font-size: 16px;
    }

    /* =========================
       PLAYER CARD
    ========================= */

    .player-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 20px;

      padding: 20px;

      margin-top: 25px;
    }

    .url-row {
      display: flex;
      gap: 10px;
    }

    .url-input {
      flex: 1;
      min-width: 0;

      height: 54px;

      background: #080808;

      border: 1px solid var(--border);

      color: white;

      border-radius: 12px;

      padding: 0 16px;

      outline: none;
    }

    .url-input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 3px rgba(229, 9, 20, .12);
    }

    .play-btn {
      height: 54px;

      padding: 0 28px;

      border: none;

      border-radius: 12px;

      background: var(--red);

      color: white;

      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    .play-btn:hover {
      background: var(--red2);
      transform: translateY(-1px);
    }

    /* =========================
       VIDEO
    ========================= */

    .video-container {
      background: #000;

      margin-top: 18px;

      border-radius: 15px;

      overflow: hidden;

      border: 1px solid #222;
    }

    video {
      display: block;

      width: 100%;

      max-height: 620px;

      background: #000;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      display: flex;

      gap: 9px;

      flex-wrap: wrap;

      margin-top: 14px;
    }

    .control-btn {
      background: var(--card2);

      color: white;

      border: 1px solid var(--border);

      padding: 11px 16px;

      border-radius: 10px;

      cursor: pointer;

      transition: .2s;
    }

    .control-btn:hover:not(:disabled) {
      border-color: #555;
      background: #202020;
    }

    .control-btn:disabled {
      color: #666;
      background: var(--disabled);
      border-color: #252525;
      cursor: not-allowed;
      opacity: .6;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      margin-top: 14px;

      padding: 13px 15px;

      border-radius: 10px;

      background: #0b0b0b;

      border: 1px solid var(--border);

      color: var(--muted);

      font-size: 14px;
    }

    /* =========================
       SECTIONS
    ========================= */

    .content-section {
      margin-top: 70px;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 18px;
    }

    /* =========================
       HISTORY
    ========================= */

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      background: var(--card);

      border: 1px solid var(--border);

      padding: 14px;

      border-radius: 11px;

      cursor: pointer;

      color: #ddd;

      word-break: break-all;

      transition: .2s;
    }

    .history-item:hover {
      border-color: #555;
    }

    .empty {
      color: var(--muted);
      padding: 20px 0;
    }

    /* =========================
       SUPPORT
    ========================= */

    .support-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 28px;

      text-align: center;
    }

    .support-card p {
      color: var(--muted);

      margin: 10px 0 22px;

      line-height: 1.7;
    }

    .telegram-btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

      background: #229ed9;

      color: white;

      padding: 13px 22px;

      border-radius: 11px;

      font-weight: bold;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid var(--border);

      text-align: center;

      color: #666;

      padding: 25px;

      font-size: 13px;
    }

    /* =========================
       RTL
    ========================= */

    body.rtl .url-input {
      direction: rtl;
      text-align: right;
    }

    body.rtl .history-item {
      direction: ltr;
      text-align: left;
    }

    /* =========================
       FOCUS - TV / CONSOLE
    ========================= */

    button:focus,
    input:focus,
    a:focus {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header {
        padding: 13px 4%;
      }

      .brand-text span {
        display: none;
      }

      .brand-text h1 {
        font-size: 18px;
      }

      .logo {
        width: 38px;
        height: 38px;
        font-size: 21px;
      }

      nav {
        display: none;
      }

      main {
        width: 94%;
        padding-top: 25px;
      }

      .hero {
        padding-top: 20px;
      }

      .url-row {
        flex-direction: column;
      }

      .play-btn {
        width: 100%;
      }

      .controls {
        display: grid;

        grid-template-columns: 1fr 1fr;
      }

      .control-btn {
        width: 100%;
      }

      .player-card {
        padding: 12px;
        border-radius: 15px;
      }
    }

  </style>
</head>


<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="brand">

      <div class="logo">
        V
      </div>

      <div class="brand-text">

        <h1>
          Mr V Player
        </h1>

        <span data-i18n="subtitle">
          Universal Network Video Player
        </span>

      </div>

    </div>


    <div class="header-right">

      <nav>

        <button
          onclick="scrollToSection('home')"
          data-i18n="home">
          Home
        </button>

        <button
          onclick="scrollToSection('history')"
          data-i18n="history">
          History
        </button>

        <button
          onclick="scrollToSection('support')"
          data-i18n="support">
          Support
        </button>

      </nav>


      <button
        class="language-btn"
        onclick="toggleLanguage()"
        id="languageBtn">

        🇮🇷 فارسی

      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>


    <!-- HOME -->

    <section id="home">

      <div class="hero">

        <h2 data-i18n="heroTitle">
          Play Your Stream
        </h2>

        <p data-i18n="heroText">
          Enter a direct video URL and start watching.
        </p>

      </div>


      <div class="player-card">


        <!-- URL -->

        <div class="url-row">

          <input
            id="urlInput"
            class="url-input"
            type="url"
            placeholder="Enter video URL..."
            data-placeholder="urlPlaceholder"
          >


          <button
            class="play-btn"
            onclick="playVideo()"
            data-i18n="play">

            ▶ PLAY

          </button>

        </div>


        <!-- VIDEO -->

        <div class="video-container">

          <video
            id="video"
            controls
            playsinline>
          </video>

        </div>


        <!-- CONTROLS -->

        <div class="controls">


          <button
            class="control-btn"
            onclick="fullscreenVideo()"
            data-i18n="fullscreen">

            ⛶ Fullscreen

          </button>


          <button
            class="control-btn"
            onclick="downloadVideo()"
            id="downloadBtn"
            disabled
            data-i18n="download">

            ⬇️ Download

          </button>


          <button
            class="control-btn"
            onclick="clearVideo()"
            data-i18n="clear">

            ✕ Clear

          </button>


          <button
            class="control-btn"
            onclick="newUrl()"
            data-i18n="newUrl">

            ＋ New URL

          </button>


        </div>


        <!-- STATUS -->

        <div
          class="status"
          id="status">

          Ready.

        </div>


      </div>

    </section>


    <!-- HISTORY -->

    <section
      id="history"
      class="content-section">

      <h2
        class="section-title"
        data-i18n="historyTitle">

        History

      </h2>


      <div
        id="historyList"
        class="history-list">
      </div>

    </section>


    <!-- SUPPORT -->

    <section
      id="support"
      class="content-section">

      <h2
        class="section-title"
        data-i18n="supportTitle">

        Support

      </h2>


      <div class="support-card">

        <p data-i18n="supportText">

          Need help with Mr V Player?
          Contact us on Telegram.

        </p>


        <a
          class="telegram-btn"
          href="https://t.me/Adrian_Vahdani"
          target="_blank"
          rel="noopener">

          ✈ Telegram

        </a>

      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer>

    © 2026 Mr V Player

  </footer>


  <script>

    /* =========================
       TRANSLATIONS
    ========================= */

    const translations = {

      en: {

        subtitle:
          "Universal Network Video Player",

        home:
          "Home",

        history:
          "History",

        support:
          "Support",

        heroTitle:
          "Play Your Stream",

        heroText:
          "Enter a direct video URL and start watching.",

        urlPlaceholder:
          "Enter video URL...",

        play:
          "▶ PLAY",

        fullscreen:
          "⛶ Fullscreen",

        download:
          "⬇️ Download",

        clear:
          "✕ Clear",

        newUrl:
          "＋ New URL",

        ready:
          "Ready.",

        loading:
          "Loading...",

        playing:
          "Playing",

        error:
          "Unable to play this video.",

        downloadReady:
          "Download is available.",

        downloadUnavailable:
          "Download is not available for this video.",

        noUrl:
          "Please enter a video URL.",

        historyTitle:
          "History",

        noHistory:
          "No videos in history yet.",

        supportTitle:
          "Support",

        supportText:
          "Need help with Mr V Player? Contact us on Telegram."

      },


      fa: {

        subtitle:
          "پخش‌کننده ویدیوی شبکه‌ای",

        home:
          "خانه",

        history:
          "تاریخچه",

        support:
          "پشتیبانی",

        heroTitle:
          "ویدیوی خود را پخش کنید",

        heroText:
          "آدرس مستقیم ویدیو را وارد کنید و شروع به تماشا کنید.",

        urlPlaceholder:
          "آدرس ویدیو را وارد کنید...",

        play:
          "▶ پخش",

        fullscreen:
          "⛶ تمام صفحه",

        download:
          "⬇️ دانلود",

        clear:
          "✕ پاک کردن",

        newUrl:
          "＋ آدرس جدید",

        ready:
          "آماده.",

        loading:
          "در حال بارگذاری...",

        playing:
          "در حال پخش",

        error:
          "امکان پخش این ویدیو وجود ندارد.",

        downloadReady:
          "دانلود این ویدیو امکان‌پذیر است.",

        downloadUnavailable:
          "دانلود این ویدیو در دسترس نیست.",

        noUrl:
          "لطفاً آدرس ویدیو را وارد کنید.",

        historyTitle:
          "تاریخچه",

        noHistory:
          "هنوز ویدیویی در تاریخچه وجود ندارد.",

        supportTitle:
          "پشتیبانی",

        supportText:
          "برای دریافت کمک درباره Mr V Player از طریق تلگرام با ما در ارتباط باشید."

      }

    };


    /* =========================
       LANGUAGE
    ========================= */

    let currentLanguage =
      localStorage.getItem("mrVLanguage");


    if (!currentLanguage) {

      const browserLanguage =
        navigator.language ||
        navigator.userLanguage ||
        "";

      currentLanguage =
        browserLanguage
          .toLowerCase()
          .startsWith("fa")
          ? "fa"
          : "en";

    }


    function setLanguage(lang) {

      currentLanguage = lang;

      localStorage.setItem(
        "mrVLanguage",
        lang
      );


      document.documentElement.lang =
        lang;


      if (lang === "fa") {

        document.documentElement.dir =
          "rtl";

        document.body.classList.add(
          "rtl"
        );

      } else {

        document.documentElement.dir =
          "ltr";

        document.body.classList.remove(
          "rtl"
        );

      }


      document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

          const key =
            element.getAttribute(
              "data-i18n"
            );

          if (
            translations[lang][key]
          ) {

            element.textContent =
              translations[lang][key];

          }

        });


      document
        .querySelectorAll("[data-placeholder]")
        .forEach(element => {

          const key =
            element.getAttribute(
              "data-placeholder"
            );

          if (
            translations[lang][key]
          ) {

            element.placeholder =
              translations[lang][key];

          }

        });


      document.getElementById(
        "languageBtn"
      ).textContent =
        lang === "fa"
          ? "🇬🇧 English"
          : "🇮🇷 فارسی";


      renderHistory();

    }


    function toggleLanguage() {

      if (
        currentLanguage === "fa"
      ) {

        setLanguage("en");

      } else {

        setLanguage("fa");

      }

    }


    /* =========================
       PLAYER
    ========================= */

    const video =
      document.getElementById("video");

    const urlInput =
      document.getElementById("urlInput");

    const statusBox =
      document.getElementById("status");

    const downloadBtn =
      document.getElementById("downloadBtn");


    let hls = null;

    let currentDownloadUrl = "";


    function updateStatus(messageKey) {

      if (
        translations[currentLanguage][
          messageKey
        ]
      ) {

        statusBox.textContent =
          translations[currentLanguage][
            messageKey
          ];

      } else {

        statusBox.textContent =
          messageKey;

      }

    }


    /* =========================
       DOWNLOAD FORMAT CHECK
    ========================= */

    function isDirectDownloadFormat(url) {

      const cleanUrl =
        url
          .split("?")[0]
          .split("#")[0]
          .toLowerCase();


      return (

        cleanUrl.endsWith(".mp4") ||

        cleanUrl.endsWith(".webm") ||

        cleanUrl.endsWith(".mov") ||

        cleanUrl.endsWith(".m4v")

      );

    }


    function updateDownloadButton(url) {

      if (
        isDirectDownloadFormat(url)
      ) {

        downloadBtn.disabled =
          false;

        currentDownloadUrl =
          url;

      } else {

        downloadBtn.disabled =
          true;

        currentDownloadUrl =
          "";

      }

    }


    /* =========================
       PLAY VIDEO
    ========================= */

    function playVideo() {

      const url =
        urlInput.value.trim();


      if (!url) {

        updateStatus("noUrl");

        updateDownloadButton("");

        return;

      }


      updateStatus("loading");


      updateDownloadButton(url);


      if (hls) {

        hls.destroy();

        hls = null;

      }


      video.pause();

      video.removeAttribute("src");

      video.load();


      const isHLS =
        url
          .toLowerCase()
          .split("?")[0]
          .endsWith(".m3u8");


      /* =========================
         HLS
      ========================= */

      if (
        isHLS &&
        window.Hls &&
        Hls.isSupported()
      ) {

        hls =
          new Hls();


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
          Hls.Events.MANIFEST_PARSED,
          function () {

            video
              .play()
              .then(() => {

                updateStatus(
                  "playing"
                );

              })
              .catch(() => {

                updateStatus(
                  "ready"
                );

              });

          }
        );


        hls.on(
          Hls.Events.ERROR,
          function (
            event,
            data
          ) {

            if (data.fatal) {

              updateStatus(
                "error"
              );

              updateDownloadButton(
                ""
              );

            }

          }
        );

      }


      /* =========================
         NATIVE VIDEO / MP4
      ========================= */

      else {

        video.src =
          url;


        video
          .play()
          .then(() => {

            updateStatus(
              "playing"
            );

          })
          .catch(() => {

            updateStatus(
              "error"
            );

          });

      }


      saveHistory(url);


      if (
        isDirectDownloadFormat(url)
      ) {

        updateStatus(
          "downloadReady"
        );

      }

    }


    /* =========================
       DOWNLOAD
    ========================= */

    function downloadVideo() {

      if (!currentDownloadUrl) {

        updateStatus(
          "downloadUnavailable"
        );

        return;

      }


      const link =
        document.createElement("a");


      link.href =
        currentDownloadUrl;


      link.download =
        "Mr-V-Player-Video";


      link.target =
        "_blank";


      link.rel =
        "noopener";


      document.body.appendChild(
        link
      );


      link.click();


      document.body.removeChild(
        link
      );

    }


    /* =========================
       CLEAR
    ========================= */

    function clearVideo() {

      if (hls) {

        hls.destroy();

        hls = null;

      }


      video.pause();

      video.removeAttribute("src");

      video.load();


      updateDownloadButton("");

      updateStatus("ready");

    }


    /* =========================
       NEW URL
    ========================= */

    function newUrl() {

      clearVideo();

      urlInput.value = "";

      urlInput.focus();

    }


    /* =========================
       FULLSCREEN
    ========================= */

    function fullscreenVideo() {

      if (
        video.requestFullscreen
      ) {

        video.requestFullscreen();

      }

      else if (
        video.webkitEnterFullscreen
      ) {

        video.webkitEnterFullscreen();

      }

    }


    /* =========================
       HISTORY
    ========================= */

    function getHistory() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "mrVHistory"
          ) || "[]"
        );

      } catch {

        return [];

      }

    }


    function saveHistory(url) {

      let history =
        getHistory();


      history =
        history.filter(
          item =>
            item !== url
        );


      history.unshift(url);


      history =
        history.slice(0, 8);


      localStorage.setItem(
        "mrVHistory",
        JSON.stringify(history)
      );


      renderHistory();

    }


    function renderHistory() {

      const list =
        document.getElementById(
          "historyList"
        );


      const history =
        getHistory();


      list.innerHTML = "";


      if (!history.length) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty";


        empty.textContent =
          translations[
            currentLanguage
          ].noHistory;


        list.appendChild(
          empty
        );


        return;

      }


      history.forEach(
        url => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "history-item";


          item.textContent =
            url;


          item.onclick =
            function () {

              urlInput.value =
                url;


              scrollToSection(
                "home"
              );


              playVideo();

            };


          list.appendChild(
            item
          );

        }
      );

    }


    /* =========================
       NAVIGATION
    ========================= */

    function scrollToSection(id) {

      document
        .getElementById(id)
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    /* =========================
       START
    ========================= */

    setLanguage(
      currentLanguage
    );

  </script>

</body>

</html>
