<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Video Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #222;
      color: white;
    }

    button {
      padding: 18px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
    }

    button:hover {
      background: #dddddd;
    }

    video {
      width: 100%;
      max-height: 650px;
      background: black;
      border-radius: 10px;
      display: block;
    }

    #status {
      margin-top: 15px;
      min-height: 25px;
      font-size: 16px;
      color: #cccccc;
    }

    .example {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
      direction: ltr;
      word-break: break-all;
    }

    @media (max-width: 700px) {
      .input-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Network Video Player</h1>

    <div class="input-box">
      <input
        id="videoUrl"
        type="text"
        placeholder="آدرس ویدئو یا M3U8 را وارد کنید..."
        autocomplete="off"
      >

      <button onclick="playVideo()">▶ پخش</button>
    </div>

    <video id="video" controls playsinline></video>

    <div id="status">آدرس ویدئو را وارد کنید.</div>

    <div class="example">
      Test HLS:
      https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8
    </div>

  </div>

  <script>
    const video = document.getElementById("video");
    const input = document.getElementById("videoUrl");
    const status = document.getElementById("status");

    let hls = null;

    function playVideo() {

      const url = input.value.trim();

      if (!url) {
        status.textContent = "❌ لطفاً آدرس ویدئو را وارد کنید.";
        return;
      }

      // ذخیره آخرین آدرس
      localStorage.setItem("lastVideoUrl", url);

      // توقف پخش قبلی
      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();

      status.textContent = "⏳ در حال بارگذاری...";

      // تشخیص HLS / M3U8
      const isHls =
        url.toLowerCase().includes(".m3u8") ||
        url.toLowerCase().includes("application/vnd.apple.mpegurl");

      if (isHls) {

        // مرورگرهایی که HLS را مستقیماً پشتیبانی می‌کنند
        if (video.canPlayType("application/vnd.apple.mpegurl")) {

          video.src = url;

          video.play()
            .then(() => {
              status.textContent = "▶ در حال پخش";
            })
            .catch(() => {
              status.textContent = "ℹ️ برای شروع، دکمه Play را بزنید.";
            });

        }

        // استفاده از HLS.js
        else if (Hls.isSupported()) {

          hls = new Hls();

          hls.loadSource(url);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, function () {

            status.textContent = "▶ آماده پخش";

            video.play().catch(() => {
              status.textContent = "ℹ️ برای شروع، دکمه Play را بزنید.";
            });

          });

          hls.on(Hls.Events.ERROR, function (event, data) {

            console.log("HLS Error:", data);

            if (data.fatal) {
              status.textContent =
                "❌ خطا در دریافت استریم. ممکن است سرور اجازه پخش در مرورگر را ندهد.";
            }
          });

        }

        else {
          status.textContent =
            "❌ این مرورگر از HLS پشتیبانی نمی‌کند.";
        }

      }

      // ویدئوهای معمولی مثل MP4 و WebM
      else {

        video.src = url;

        video.play()
          .then(() => {
            status.textContent = "▶ در حال پخش";
          })
          .catch(() => {
            status.textContent =
              "❌ ویدئو قابل پخش نیست یا فرمت آن توسط مرورگر پشتیبانی نمی‌شود.";
          });

        video.onerror = function () {
          status.textContent =
            "❌ خطا: این فایل/آدرس توسط مرورگر قابل پخش نیست.";
        };
      }
    }

    // با Enter هم پخش شود
    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        playVideo();
      }
    });

    // بازیابی آخرین URL
    const lastUrl = localStorage.getItem("lastVideoUrl");

    if (lastUrl) {
      input.value = lastUrl;
    }
  </script>

</body>
</html>
