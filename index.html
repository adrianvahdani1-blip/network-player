<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr V Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --card: #111111;
      --card2: #171717;
      --red: #e50914;
      --red2: #ff1e2d;
      --text: #ffffff;
      --muted: #9a9a9a;
      --border: #292929;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button, input {
      font: inherit;
    }

    header {
      width: 100%;
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,8,.95);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(229,9,20,.25);
    }

    .brand-text h1 {
      font-size: 21px;
    }

    .brand-text span {
      color: var(--muted);
      font-size: 12px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button,
    .language-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #ccc;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      transition: .2s;
    }

    nav button:hover,
    .language-btn:hover {
      color: white;
      background: #191919;
    }

    .language-btn {
      border-color: var(--border);
      color: white;
      font-weight: bold;
    }

    main {
      width: min(1050px, 92%);
      margin: auto;
      padding: 45px 0 60px;
    }

    section {
      scroll-margin-top: 100px;
    }

    .hero {
      text-align: center;
      padding: 35px 0 30px;
    }

    .hero h2 {
      font-size: clamp(30px, 5vw, 52px);
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--muted);
      font-size: 16px;
    }

    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-top: 25px;
    }

    .url-row {
      display: flex;
      gap: 10px;
    }

    .url-input {
      flex: 1;
      min-width: 0;
      height: 54px;
      background: #080808;
      border: 1px solid var(--border);
      color: white;
      border-radius: 12px;
      padding: 0 16px;
      outline: none;
    }

    .url-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(229,9,20,.12);
    }

    .play-btn {
      height: 54px;
      padding: 0 28px;
      border: none;
      border-radius: 12px;
      background: var(--red);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .play-btn:hover {
      background: var(--red2);
      transform: translateY(-1px);
    }

    .video-container {
      background: #000;
      margin-top: 18px;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #222;
      position: relative;
    }

    video {
      display: block;
      width: 100%;
      max-height: 620px;
      background: #000;
    }

    #youtubeFrame {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #000;
    }

    .controls {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .control-btn {
      background: var(--card2);
      color: white;
      border: 1px solid var(--border);
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .control-btn:hover {
      border-color: #555;
      background: #202020;
    }

    .control-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 10px;
      background: #0b0b0b;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    .content-section {
      margin-top: 70px;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 18px;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 11px;
      cursor: pointer;
      color: #ddd;
      word-break: break-all;
    }

    .history-item:hover {
      border-color: #555;
    }

    .empty {
      color: var(--muted);
      padding: 20px 0;
    }

    .support-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      text-align: center;
    }

    .support-card p {
      color: var(--muted);
      margin: 10px 0 22px;
      line-height: 1.7;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #229ed9;
      color: white;
      padding: 13px 22px;
      border-radius: 11px;
      font-weight: bold;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      color: #666;
      padding: 25px;
      font-size: 13px;
    }

    body.rtl .url-input {
      direction: rtl;
      text-align: right;
    }

    body.rtl .history-item {
      direction: ltr;
      text-align: left;
    }

    @media (max-width: 700px) {
      header {
        padding: 13px 4%;
      }

      .brand-text span {
        display: none;
      }

      .brand-text h1 {
        font-size: 18px;
      }

      .logo {
        width: 38px;
        height: 38px;
        font-size: 21px;
      }

      nav {
        display: none;
      }

      main {
        width: 94%;
        padding-top: 25px;
      }

      .hero {
        padding-top: 20px;
      }

      .url-row {
        flex-direction: column;
      }

      .play-btn {
        width: 100%;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .control-btn {
        width: 100%;
      }

      .player-card {
        padding: 12px;
        border-radius: 15px;
      }
    }

    button:focus,
    input:focus,
    a:focus {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">V</div>

    <div class="brand-text">
      <h1>Mr V Player</h1>
      <span data-i18n="subtitle">Universal Network Video Player</span>
    </div>
  </div>

  <div class="header-right">
    <nav>
      <button onclick="scrollToSection('home')" data-i18n="home">Home</button>
      <button onclick="scrollToSection('history')" data-i18n="history">History</button>
      <button onclick="scrollToSection('support')" data-i18n="support">Support</button>
    </nav>

    <button class="language-btn" onclick="toggleLanguage()" id="languageBtn">
      🇮🇷 فارسی
    </button>
  </div>
</header>

<main>

  <section id="home">

    <div class="hero">
      <h2 data-i18n="heroTitle">Play Your Stream</h2>
      <p data-i18n="heroText">
        Enter a video URL or YouTube link and start watching.
      </p>
    </div>

    <div class="player-card">

      <div class="url-row">

        <input
          id="urlInput"
          class="url-input"
          type="url"
          placeholder="Enter video URL or YouTube link..."
          data-placeholder="urlPlaceholder"
          autocomplete="off"
        >

        <button
          class="play-btn"
          onclick="playVideo()"
          data-i18n="play"
        >
          ▶ PLAY
        </button>

      </div>

      <div class="video-container">

        <video
          id="video"
          controls
          playsinline>
        </video>

        <iframe
          id="youtubeFrame"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>

      </div>

      <div class="controls">

        <button
          class="control-btn"
          onclick="fullscreenVideo()"
          data-i18n="fullscreen">
          ⛶ Fullscreen
        </button>

        <button
          class="control-btn"
          onclick="downloadVideo()"
          id="downloadBtn"
          disabled
          data-i18n="download">
          ⬇️ Download
        </button>

        <button
          class="control-btn"
          onclick="clearVideo()"
          data-i18n="clear">
          ✕ Clear
        </button>

        <button
          class="control-btn"
          onclick="newUrl()"
          data-i18n="newUrl">
          ＋ New URL
        </button>

      </div>

      <div class="status" id="status">
        <span data-i18n="ready">Ready.</span>
      </div>

    </div>

  </section>

  <section id="history" class="content-section">

    <h2 class="section-title" data-i18n="historyTitle">
      History
    </h2>

    <div id="historyList" class="history-list"></div>

  </section>

  <section id="support" class="content-section">

    <h2 class="section-title" data-i18n="supportTitle">
      Support
    </h2>

    <div class="support-card">

      <p data-i18n="supportText">
        Need help with Mr V Player? Contact us on Telegram.
      </p>

      <a
        class="telegram-btn"
        href="https://t.me/Adrian_Vahdani"
        target="_blank"
        rel="noopener">
        ✈ Telegram
      </a>

    </div>

  </section>

</main>

<footer>
  © 2026 Mr V Player
</footer>

<script>

  /* =========================
     TRANSLATIONS
  ========================= */

  const translations = {

    en: {
      subtitle: "Universal Network Video Player",
      home: "Home",
      history: "History",
      support: "Support",

      heroTitle: "Play Your Stream",
      heroText: "Enter a video URL or YouTube link and start watching.",

      urlPlaceholder: "Enter video URL or YouTube link...",
      play: "▶ PLAY",

      fullscreen: "⛶ Fullscreen",
      download: "⬇️ Download",
      clear: "✕ Clear",
      newUrl: "＋ New URL",

      ready: "Ready.",
      loading: "Loading...",
      playing: "Playing",
      error: "Unable to play this video.",
      youtube: "YouTube video loaded.",
      downloadUnavailable: "Download is available only for direct video files.",

      historyTitle: "History",
      noHistory: "No videos in history yet.",

      supportTitle: "Support",
      supportText: "Need help with Mr V Player? Contact us on Telegram."
    },

    fa: {
      subtitle: "پخش‌کننده ویدیوی شبکه‌ای",
      home: "خانه",
      history: "تاریخچه",
      support: "پشتیبانی",

      heroTitle: "ویدیای خود را پخش کنید",
      heroText: "آدرس ویدیو یا لینک یوتیوب را وارد کنید و شروع به تماشا کنید.",

      urlPlaceholder: "آدرس ویدیو یا لینک یوتیوب را وارد کنید...",
      play: "▶ پخش",

      fullscreen: "⛶ تمام صفحه",
      download: "⬇️ دانلود",
      clear: "✕ پاک کردن",
      newUrl: "＋ آدرس جدید",

      ready: "آماده.",
      loading: "در حال بارگذاری...",
      playing: "در حال پخش",
      error: "امکان پخش این ویدیو وجود ندارد.",
      youtube: "ویدیوی یوتیوب بارگذاری شد.",
      downloadUnavailable: "دانلود فقط برای فایل‌های مستقیم ویدیویی فعال است.",

      historyTitle: "تاریخچه",
      noHistory: "هنوز ویدیویی در تاریخچه وجود ندارد.",

      supportTitle: "پشتیبانی",
      supportText: "برای دریافت کمک درباره Mr V Player از طریق تلگرام با ما در ارتباط باشید."
    }

  };


  /* =========================
     LANGUAGE
  ========================= */

  let currentLanguage =
    localStorage.getItem("mrVLanguage");

  if (!currentLanguage) {

    const browserLanguage =
      navigator.language ||
      navigator.userLanguage ||
      "";

    currentLanguage =
      browserLanguage
        .toLowerCase()
        .startsWith("fa")
        ? "fa"
        : "en";
  }


  function setLanguage(lang) {

    currentLanguage = lang;

    localStorage.setItem(
      "mrVLanguage",
      lang
    );

    document.documentElement.lang = lang;

    if (lang === "fa") {

      document.documentElement.dir = "rtl";

      document.body.classList.add("rtl");

    } else {

      document.documentElement.dir = "ltr";

      document.body.classList.remove("rtl");

    }


    document
      .querySelectorAll("[data-i18n]")
      .forEach(element => {

        const key =
          element.getAttribute("data-i18n");

        if (translations[lang][key]) {

          element.textContent =
            translations[lang][key];

        }

      });


    document
      .querySelectorAll("[data-placeholder]")
      .forEach(element => {

        const key =
          element.getAttribute("data-placeholder");

        if (translations[lang][key]) {

          element.placeholder =
            translations[lang][key];

        }

      });


    document.getElementById(
      "languageBtn"
    ).textContent =
      lang === "fa"
        ? "🇬🇧 English"
        : "🇮🇷 فارسی";


    updateStatus("ready");

    renderHistory();

  }


  function toggleLanguage() {

    setLanguage(
      currentLanguage === "fa"
        ? "en"
        : "fa"
    );

  }


  /* =========================
     PLAYER
  ========================= */

  const video =
    document.getElementById("video");

  const youtubeFrame =
    document.getElementById("youtubeFrame");

  const urlInput =
    document.getElementById("urlInput");

  const statusBox =
    document.getElementById("status");

  const downloadBtn =
    document.getElementById("downloadBtn");


  let hls = null;
  let currentDownloadUrl = "";


  function updateStatus(key) {

    statusBox.textContent =
      translations[currentLanguage][key] || key;

  }


  /* =========================
     YOUTUBE DETECTION
  ========================= */

  function isYouTube(url) {

    try {

      const parsed =
        new URL(url);

      const host =
        parsed.hostname.toLowerCase();

      return (
        host === "youtube.com" ||
        host === "www.youtube.com" ||
        host === "m.youtube.com" ||
        host === "youtu.be" ||
        host === "www.youtube-nocookie.com"
      );

    } catch {

      return false;

    }

  }


  function getYouTubeId(url) {

    try {

      const parsed =
        new URL(url);

      const host =
        parsed.hostname.toLowerCase();


      if (
        host === "youtu.be" ||
        host === "www.youtu.be"
      ) {

        return parsed.pathname
          .replace("/", "")
          .split("/")[0];

      }


      if (
        host.includes("youtube.com")
      ) {

        if (
          parsed.pathname === "/watch"
        ) {

          return parsed.searchParams.get("v");

        }


        if (
          parsed.pathname.startsWith("/shorts/")
        ) {

          return parsed.pathname
            .split("/")[2];

        }


        if (
          parsed.pathname.startsWith("/embed/")
        ) {

          return parsed.pathname
            .split("/")[2];

        }


        if (
          parsed.pathname.startsWith("/live/")
        ) {

          return parsed.pathname
            .split("/")[2];

        }

      }

    } catch {

      return null;

    }

    return null;

  }


  /* =========================
     DIRECT DOWNLOAD
  ========================= */

  function isDirectDownloadFormat(url) {

    const cleanUrl =
      url
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();


    return (
      cleanUrl.endsWith(".mp4") ||
      cleanUrl.endsWith(".webm") ||
      cleanUrl.endsWith(".mov") ||
      cleanUrl.endsWith(".m4v")
    );

  }


  /* =========================
     YOUTUBE PLAYER
  ========================= */

  function playYouTube(url) {

    const videoId =
      getYouTubeId(url);


    if (!videoId) {

      updateStatus("error");

      return false;

    }


    if (hls) {

      hls.destroy();
      hls = null;

    }


    video.pause();
    video.removeAttribute("src");
    video.load();


    video.style.display = "none";

    youtubeFrame.style.display =
      "block";


    youtubeFrame.src =
      "https://www.youtube.com/embed/" +
      encodeURIComponent(videoId) +
      "?autoplay=1&rel=0";


    currentDownloadUrl = "";

    downloadBtn.disabled = true;


    updateStatus("youtube");

    return true;

  }


  /* =========================
     PLAY VIDEO
  ========================= */

  function playVideo() {

    const url =
      urlInput.value.trim();


    if (!url) {

      statusBox.textContent =
        currentLanguage === "fa"
          ? "لطفاً آدرس ویدیو را وارد کنید."
          : "Please enter a video URL.";

      return;

    }


    updateStatus("loading");


    /* YouTube */

    if (isYouTube(url)) {

      if (playYouTube(url)) {

        saveHistory(url);

      }

      return;

    }


    /* Reset YouTube */

    youtubeFrame.src = "";
    youtubeFrame.style.display =
      "none";

    video.style.display =
      "block";


    /* Destroy previous HLS */

    if (hls) {

      hls.destroy();
      hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    currentDownloadUrl = "";


    /* HLS */

    const isHLS =
      url
        .toLowerCase()
        .includes(".m3u8");


    if (
      isHLS &&
      window.Hls &&
      Hls.isSupported()
    ) {

      hls = new Hls();

      hls.loadSource(url);

      hls.attachMedia(video);


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

          video.play()
            .then(() => {
              updateStatus("playing");
            })
            .catch(() => {
              updateStatus("ready");
            });

        }
      );


      hls.on(
        Hls.Events.ERROR,
        function (event, data) {

          if (data.fatal) {

            updateStatus("error");

          }

        }
      );

    }

    else {

      video.src = url;


      video.play()
        .then(() => {

          updateStatus("playing");

        })
        .catch(() => {

          updateStatus("error");

        });

    }


    /* Download */

    if (
      isDirectDownloadFormat(url)
    ) {

      currentDownloadUrl = url;

      downloadBtn.disabled = false;

    } else {

      currentDownloadUrl = "";

      downloadBtn.disabled = true;

    }


    saveHistory(url);

  }


  /* =========================
     DOWNLOAD
  ========================= */

  function downloadVideo() {

    if (!currentDownloadUrl) {

      updateStatus(
        "downloadUnavailable"
      );

      return;

    }


    const link =
      document.createElement("a");

    link.href =
      currentDownloadUrl;

    link.download =
      "Mr-V-Player-Video";

    link.target =
      "_blank";

    link.rel =
      "noopener";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

  }


  /* =========================
     CLEAR
  ========================= */

  function clearVideo() {

    if (hls) {

      hls.destroy();
      hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    youtubeFrame.src = "";

    youtubeFrame.style.display =
      "none";

    video.style.display =
      "block";


    currentDownloadUrl = "";

    downloadBtn.disabled = true;


    updateStatus("ready");

  }


  /* =========================
     NEW URL
  ========================= */

  function newUrl() {

    clearVideo();

    urlInput.value = "";

    urlInput.focus();

  }


  /* =========================
     FULLSCREEN
  ========================= */

  function fullscreenVideo() {

    const activePlayer =
      youtubeFrame.style.display !== "none"
        ? youtubeFrame
        : video;


    if (activePlayer.requestFullscreen) {

      activePlayer.requestFullscreen();

    }

    else if (
      activePlayer.webkitEnterFullscreen
    ) {

      activePlayer.webkitEnterFullscreen();

    }

  }


  /* =========================
     HISTORY
  ========================= */

  function getHistory() {

    try {

      return JSON.parse(
        localStorage.getItem(
          "mrVHistory"
        ) || "[]"
      );

    } catch {

      return [];

    }

  }


  function saveHistory(url) {

    let history =
      getHistory();


    history =
      history.filter(
        item => item !== url
      );


    history.unshift(url);


    history =
      history.slice(0, 8);


    localStorage.setItem(
      "mrVHistory",
      JSON.stringify(history)
    );


    renderHistory();

  }


  function renderHistory() {

    const list =
      document.getElementById(
        "historyList"
      );


    const history =
      getHistory();


    list.innerHTML = "";


    if (!history.length) {

      const empty =
        document.createElement("div");


      empty.className =
        "empty";


      empty.textContent =
        translations[
          currentLanguage
        ].noHistory;


      list.appendChild(empty);

      return;

    }


    history.forEach(url => {

      const item =
        document.createElement("div");


      item.className =
        "history-item";


      item.textContent =
        url;


      item.onclick =
        function () {

          urlInput.value =
            url;

          scrollToSection(
            "home"
          );

          playVideo();

        };


      list.appendChild(item);

    });

  }


  /* =========================
     NAVIGATION
  ========================= */

  function scrollToSection(id) {

    document
      .getElementById(id)
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  /* =========================
     ENTER KEY
  ========================= */

  urlInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        playVideo();

      }

    }
  );


  /* =========================
     START
  ========================= */

  setLanguage(
    currentLanguage
  );
/* =========================
   GAMEPAD SUPPORT
========================= */

let focusedIndex = 0;
let gameElements = [];
let gamepadActive = false;


function updateGameElements() {

  gameElements = Array.from(
    document.querySelectorAll(
      "button, input, a"
    )
  );

}


function focusGameElement() {

  if (gameElements.length > 0) {

    gameElements[focusedIndex].focus();

  }

}


function startGamepad() {

  if (gamepadActive) return;

  gamepadActive = true;

  updateGameElements();

  gamepadLoop();

}


function gamepadLoop() {

  const pads = navigator.getGamepads();

  const pad = pads[0];


  if (pad) {

    // دکمه A در Xbox / ضربدر در PlayStation
    if (pad.buttons[0].pressed) {

      if (
        document.activeElement &&
        document.activeElement.click
      ) {

        document.activeElement.click();

      }

    }


    // پایین
    if (pad.buttons[13].pressed) {

      focusedIndex++;

      if (
        focusedIndex >= gameElements.length
      ) {

        focusedIndex = 0;

      }

      focusGameElement();

    }


    // بالا
    if (pad.buttons[12].pressed) {

      focusedIndex--;

      if (focusedIndex < 0) {

        focusedIndex =
          gameElements.length - 1;

      }

      focusGameElement();

    }


    // دکمه B در Xbox / دایره در PlayStation
    if (pad.buttons[1].pressed) {

      clearVideo();

    }

  }


  requestAnimationFrame(
    gamepadLoop
  );

}


window.addEventListener(
  "gamepadconnected",
  function() {

    console.log(
      "Gamepad connected"
    );

    startGamepad();

  }
);
</script>
