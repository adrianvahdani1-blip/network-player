<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">

  <title>Network Player</title>

  <!-- HLS Player -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      color: #999;
      margin-top: 10px;
    }

    .player-box {
      background: #151515;
      padding: 18px;
      border-radius: 15px;
    }

    video {
      width: 100%;
      max-height: 65vh;
      display: block;
      background: #000;
      border-radius: 10px;
    }

    .url-box {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    #url {
      flex: 1;
      min-width: 0;
      padding: 17px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #222;
      color: white;
      font-size: 17px;
      direction: ltr;
      outline: none;
    }

    #url:focus {
      border-color: white;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 0 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
      min-height: 55px;
    }

    button:hover {
      background: #ddd;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .secondary {
      flex: 1;
      background: #292929;
      color: white;
    }

    .secondary:hover {
      background: #383838;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #202020;
      color: #ccc;
      text-align: center;
      min-height: 45px;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #111;
      color: #888;
      font-size: 14px;
      line-height: 1.8;
    }

    .history {
      margin-top: 20px;
    }

    .history h2 {
      font-size: 20px;
    }

    .history-item {
      width: 100%;
      text-align: left;
      direction: ltr;
      margin-top: 8px;
      padding: 12px;
      min-height: auto;
      background: #1b1b1b;
      color: #ddd;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item:hover {
      background: #292929;
    }

    @media (max-width: 700px) {

      .app {
        padding: 12px;
      }

      header h1 {
        font-size: 27px;
      }

      .url-box {
        flex-direction: column;
      }

      button {
        width: 100%;
        padding: 15px;
      }

      .buttons {
        flex-direction: column;
      }

      video {
        max-height: 55vh;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🎬 Network Player</h1>
    <p>پخش ویدئو از طریق لینک مستقیم یا M3U8</p>
  </header>

  <div class="player-box">

    <video id="video" controls playsinline></video>

    <div class="url-box">

      <input
        id="url"
        type="text"
        placeholder="Video URL / M3U8"
        autocomplete="off"
        spellcheck="false"
      >

      <button id="playButton">▶ پخش</button>

    </div>

    <div class="buttons">

      <button class="secondary" id="fullscreenButton">
        ⛶ تمام صفحه
      </button>

      <button class="secondary" id="clearButton">
        🗑 پاک کردن
      </button>

    </div>

    <div id="status">
      آماده دریافت لینک ویدئو
    </div>

  </div>

  <div class="info">
    <b>فرمت‌های قابل پشتیبانی:</b><br>
    MP4، WebM و M3U8/HLS<br><br>

    توجه: پخش MKV در مرورگرها معمولاً پشتیبانی نمی‌شود.
    همچنین بعضی سرورها اجازه پخش مستقیم در مرورگر را نمی‌دهند.
  </div>

  <div class="history">

    <h2>آخرین لینک‌ها</h2>

    <div id="historyList"></div>

  </div>

</div>

<script>

  const video = document.getElementById("video");
  const urlInput = document.getElementById("url");
  const playButton = document.getElementById("playButton");
  const fullscreenButton = document.getElementById("fullscreenButton");
  const clearButton = document.getElementById("clearButton");
  const status = document.getElementById("status");
  const historyList = document.getElementById("historyList");

  let hls = null;

  function setStatus(text) {
    status.textContent = text;
  }

  function destroyHLS() {

    if (hls) {
      hls.destroy();
      hls = null;
    }

  }

  function isHLS(url) {

    const lower = url.toLowerCase();

    return (
      lower.includes(".m3u8") ||
      lower.includes("application/vnd.apple.mpegurl") ||
      lower.includes("application/x-mpegurl")
    );

  }

  function isMKV(url) {

    return url.toLowerCase().split("?")[0].endsWith(".mkv");

  }

  function saveHistory(url) {

    let history =
      JSON.parse(localStorage.getItem("networkPlayerHistory") || "[]");

    history = history.filter(item => item !== url);

    history.unshift(url);

    history = history.slice(0, 5);

    localStorage.setItem(
      "networkPlayerHistory",
      JSON.stringify(history)
    );

    showHistory();

  }

  function showHistory() {

    let history =
      JSON.parse(localStorage.getItem("networkPlayerHistory") || "[]");

    historyList.innerHTML = "";

    history.forEach(url => {

      const button = document.createElement("button");

      button.className = "history-item";

      button.textContent = url;

      button.onclick = function() {

        urlInput.value = url;

        playVideo();

      };

      historyList.appendChild(button);

    });

  }

  function playVideo() {

    const url = urlInput.value.trim();

    if (!url) {

      setStatus("❌ لطفاً لینک ویدئو را وارد کنید.");

      return;
    }

    destroyHLS();

    video.pause();

    video.removeAttribute("src");

    video.load();

    saveHistory(url);

    setStatus("⏳ در حال اتصال به ویدئو...");

    /*
      MKV
    */

    if (isMKV(url)) {

      setStatus(
        "⚠️ این لینک MKV است. مرورگر ممکن است MKV را پخش نکند."
      );

      video.src = url;

      return;
    }

    /*
      HLS / M3U8
    */

    if (isHLS(url)) {

      if (Hls.isSupported()) {

        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false
        });

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {

          setStatus("✅ استریم آماده پخش است.");

          video.play().catch(function() {

            setStatus(
              "✅ ویدئو آماده است؛ دکمه Play را بزنید."
            );

          });

        });

        hls.on(Hls.Events.ERROR, function(event, data) {

          console.log(data);

          if (data.fatal) {

            setStatus(
              "❌ خطا در دریافت M3U8. ممکن است لینک، سرور یا CORS مشکل داشته باشد."
            );

            hls.destroy();

            hls = null;
          }

        });

      }

      else if (
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ) {

        video.src = url;

        video.addEventListener(
          "loadedmetadata",
          function() {

            setStatus("✅ استریم آماده پخش است.");

            video.play().catch(function() {

              setStatus(
                "✅ ویدئو آماده است؛ دکمه Play را بزنید."
              );

            });

          },
          { once: true }
        );

      }

      else {

        setStatus(
          "❌ این مرورگر از پخش HLS پشتیبانی نمی‌کند."
        );

      }

      return;
    }

    /*
      MP4 / WebM / سایر فرمت‌های مرورگر
    */

    video.src = url;

    video.load();

    video.play().catch(function() {

      setStatus(
        "ℹ️ ویدئو آماده است؛ برای شروع Play را بزنید."
      );

    });

    video.addEventListener(
      "loadedmetadata",
      function() {

        setStatus("✅ ویدئو آماده پخش است.");

      },
      { once: true }
    );

    video.addEventListener(
      "error",
      function() {

        setStatus(
          "❌ مرورگر نتوانست این فایل را پخش کند."
        );

      },
      { once: true }
    );

  }

  /*
    دکمه پخش
  */

  playButton.addEventListener(
    "click",
    playVideo
  );

  /*
    Enter
  */

  urlInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        playVideo();

      }

    }
  );

  /*
    تمام صفحه
  */

  fullscreenButton.addEventListener(
    "click",
    function() {

      if (video.requestFullscreen) {

        video.requestFullscreen();

      }

      else if (video.webkitRequestFullscreen) {

        video.webkitRequestFullscreen();

      }

    }
  );

  /*
    پاک کردن
  */

  clearButton.addEventListener(
    "click",
    function() {

      destroyHLS();

      video.pause();

      video.removeAttribute("src");

      video.load();

      urlInput.value = "";

      setStatus("آدرس پاک شد.");

    }
  );

  /*
    آخرین URL
  */

  const lastUrl =
    localStorage.getItem("lastVideoUrl");

  if (lastUrl) {

    urlInput.value = lastUrl;

  }

  urlInput.addEventListener(
    "change",
    function() {

      localStorage.setItem(
        "lastVideoUrl",
        urlInput.value.trim()
      );

    }
  );

  showHistory();

</script>

</body>
</html>
